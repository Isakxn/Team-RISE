<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="frontPage/frontPageCSS.css"">
        <link rel="stylesheet" href="loginPage/loginCSS.css"">
    </head>

    <body>
        <div id="app"></div>
        <script src="model.js"></script>
        <script src="frontPage/frontPageView.js"></script>
        <script src="loginPage/loginView.js"></script>
        <script src="loginPage/loginController.js"></script>

        <script>
            let html = "";
            const app = document.getElementById("app");
            // TESTING / MIDLERTIDIG!!
            model.app.currentPage = "loginPage";
            //

            function updateView (){
                
                html = viewStartPage();
                app.innerHTML = html;
            }
            
            
            function viewStartPage()
            {
                if (model.app.currentPage === "frontPage")
                {
                    let main = "<div class='cssMain'>";
                    let cityList = addCityList();
                    let newestReviews = addNewestReviews();
                    return `
                        <div class="container">
                            ${cityList}
                            ${newestReviews}
                        </div>
                    `
                }

                else if (model.app.currentPage === "loginPage")
                {
                    return `
                        <button class="buttonLogin" onclick="buttonLogin()">Logg inn</button>
                        <br>
                        <div style="color: #eee;">Brukernavn:</div>
                        <input class="inputLogin" oninput="updateUsername(this.value)">
                        <br>
                        <div style="color: #eee;">Passord:</div>
                        <input class="inputLogin" oninput="updatePassword(this.value)">
                        <br>
                        ${model.viewState.loginPage.loginInvalid}
                    `;
                }
            }

            updateView ();
        </script>
    </body>
</html>
